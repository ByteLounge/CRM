# Netlify configuration for FlowCRM
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback for React Router (ensures /customers, /orders, /login don't 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
