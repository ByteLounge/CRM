# Render Blueprint for FlowCRM (Unified Full-Stack Deployment)
services:
  - type: web
    name: flowcrm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WOOCOMMERCE_MOCK_MODE
        value: "false"
      - key: WOOCOMMERCE_STORE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: WOOCOMMERCE_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
